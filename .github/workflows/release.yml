# Builds por-go for Windows (10+ and 7), macOS (Apple silicon and Intel) and Linux when a v* tag is pushed and
# publishes the binaries as that tag's GitHub release (no game data: players
# bring their own files, see the README).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # rebuild an existing tag's release
    inputs:
      tag:
        description: "Tag to build and release"
        required: true
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CGO_ENABLED: "0" # goffi's stubs link only without cgo
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix: # all cross-compiled: no cgo
        include:
          - { target: linux-amd64, goos: linux, goarch: amd64 }
          - { target: windows-amd64, goos: windows, goarch: amd64 }
          - { target: windows7-amd64, goos: windows, goarch: amd64, win7: true }
          - { target: macos-arm64, goos: darwin, goarch: arm64 }
          - { target: macos-amd64, goos: darwin, goarch: amd64 }
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    outputs:
      gameimport: ${{ steps.gi.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Sibling repos go.mod replaces (../gogpu-wgpu, ../goffi, ../goplay/third_party/gogpu)
        shell: bash
        env:
          TOKEN: ${{ secrets.RETRO_WARE_TOKEN }} # read access to the private retro-ware repos
        run: |
          git clone --depth 1 https://github.com/memmaker/wgpu.git ../gogpu-wgpu
          git clone --depth 1 https://github.com/memmaker/goffi.git ../goffi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/retro-ware/goplay.git" ../goplay
      - id: gi
        name: gameimport, its latest release tag (go.mod replaces it with ../gameimport; the importer ships beside por)
        shell: bash
        env:
          TOKEN: ${{ secrets.RETRO_WARE_TOKEN }}
        run: |
          git clone "https://x-access-token:$TOKEN@github.com/retro-ware/gameimport.git" ../gameimport
          tag=$(git -C ../gameimport describe --tags --abbrev=0)
          git -C ../gameimport checkout -q "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: ${{ !matrix.win7 }}
        with:
          go-version-file: go.mod
      - name: Go for Windows 7 (go-legacy-win7; Go dropped Windows 7 in 1.21)
        if: ${{ matrix.win7 }}
        run: |
          v=1.26.10-1 sum=39f0d5efcc3a8bf1ed54532706f3b2f0403db5b63f0693a486673f7f5a8daad4 # pinned: a third-party toolchain
          curl -fsSLo go.tgz "https://github.com/thongtech/go-legacy-win7/releases/download/v$v/go-legacy-win7-$v.linux_amd64.tar.gz"
          echo "$sum  go.tgz" | sha256sum -c
          tar xzf go.tgz -C "$RUNNER_TEMP" && rm go.tgz
          echo "$RUNNER_TEMP/go-legacy-win7/bin" >> "$GITHUB_PATH"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
      - name: Build
        run: |
          set -e
          go version
          out=por-go-${TAG}-${{ matrix.target }}
          mkdir "$out"
          exe= ld="-s -w"
          if [ "$GOOS" = windows ]; then exe=.exe ld="$ld -H windowsgui"; fi
          go build -trimpath -ldflags "$ld" -o "$out/por$exe" ./cmd/por
          (cd ../gameimport && go build -trimpath -ldflags "$ld" -o "$OLDPWD/$out/gameimport$exe" ./cmd/gameimport)
          cp README.md import.toml "$out/"; [ -f LICENSE ] && cp LICENSE "$out/" || true
          if [ "$GOOS" = windows ]; then zip -qr "$out.zip" "$out"; echo "ASSET=$out.zip" >> "$GITHUB_ENV"
          else tar czf "$out.tar.gz" "$out"; echo "ASSET=$out.tar.gz" >> "$GITHUB_ENV"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GAMEIMPORT_TAG: ${{ needs.build.outputs.gameimport }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "Binaries for Windows 10+ (windows-amd64), Windows 7 (windows7-amd64), macOS on Apple silicon (macos-arm64) and Intel (macos-amd64), and Linux. No game data is included: run gameimport (${GAMEIMPORT_TAG}) beside por to bring in your own copy of the game, see the README." *.zip *.tar.gz
